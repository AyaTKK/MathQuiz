# فاصله زمانی بین هر مسابقه به دقیقه (30 دقیقه = 30)
interval-minutes: 30

# پیام‌های پلاگین (پشتیبانی از کدهای رنگی مانند &a, &e, &c)
messages:
  prefix: "&8[&6MathQuiz&8] &r"
  question: "&eچه کسی اولین نفری است که پاسخ این سوال را می‌دهد؟ &b%question% = ?"
  correct: "&aآفرین! &e%player% &aاولین نفری بود که پاسخ درست (&f%answer%&a) را داد و جایزه گرفت!"
  no-answer: "&cزمان تمام شد! هیچ‌کس نتوانست پاسخ درست (&f%answer%&c) را پیدا کند."

# دستوراتی که به عنوان جایزه اجرا می‌شوند.
# متغیر %player% نام بازیکن برنده است.
# دستورات با سطح دسترسی کنسول اجرا می‌شوند (بدون اسلش /).
rewards:
  - "give %player% diamond 5"
  - "give %player% golden_apple 2"
  - "xp add %player% 500 points"
  # اگر پلاگین اقتصاد مانند Vault دارید:
  # - "eco give %player% 1000"
